# Uses MiniMessage format: https://docs.advntr.dev/minimessage/

# Prefix prepended to messages sent via prefixed()
prefix: "<gold>[TotemPractice]</gold> "

# Command Errors
usage: "%prefix%<red>Usage: /totempractice"
player-only: "<red>Only players can use this command."
no-permission: "<red>You don't have permission to use this command."

# Game Start
already-running: "%prefix%<red>A round is already running."
cannot-start-dead: "%prefix%<red>You cannot start a round while dead."

# Admin
point-set: "%prefix%<green><type> teleport point set."

# In-Game
round-starting: "<white>Starting in <gold><seconds>s"

# Results
results:
  title: "<gold><bold>Totem Practice"
  subtitle: "<white>Ended with Score <score>"