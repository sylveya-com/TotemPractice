# ============================================
#             Difficulty Selection
# ============================================
# title: GUI title.
# size: Inventory size (multiple of 9).
# fill-material: Material used for empty slots.
# offhand-warning: Warning shown when offhand-only is enabled.
# random-warning: Warning shown when random-totem is enabled.
#
# Placeholders:
# %interval% - Time between lethal hits in seconds.
# %multiplier% - Score multiplier.
# %offhand% - Offhand warning or empty.
# %random% - Random totem warning or empty.
# Slot keys must match difficulty names in config.yml.
# ============================================

difficulty-selection:
  title: "<white><bold>Choose difficulty"
  size: 27
  fill-material: gray_stained_glass_pane
  # Line shown only on difficulties with offhand-only enabled (via %offhand%)
  offhand-warning: "<red><bold>⚠ <red>Totem must be in offhand!"
  # Line shown only on difficulties with random-totem enabled (via %random%)
  random-warning: "<gold><bold>? <gold>Find the hidden totem!"
  slots:
      # Lethal hit interval: %interval%s | Score multiplier: x%multiplier%
    easy:
      slot: 10
      material: green_stained_glass_pane
      name: "<green><bold>Easy"
      glint: false
      lore:
        - "<gray>Lethal interval <dark_gray>» <white>%interval%s"
        - "<gray>Score multiplier <dark_gray>» <green>x%multiplier%"
        - "%offhand%"
        - "%random%"
        - ""
        - "<gray>(<white>Click to start)"

    normal:
      slot: 12
      material: yellow_stained_glass_pane
      name: "<yellow><bold>Normal"
      glint: true
      lore:
        - "<gray>Lethal interval <dark_gray>» <white>%interval%s"
        - "<gray>Score multiplier <dark_gray>» <green>x%multiplier%"
        - "%offhand%"
        - "%random%"
        - ""
        - "<gray>(<white>Click to start)"

    hard:
      slot: 14
      material: orange_stained_glass_pane
      name: "<gold><bold>Hard"
      glint: true
      lore:
        - "<gray>Lethal interval <dark_gray>» <white>%interval%s"
        - "<gray>Score multiplier <dark_gray>» <green>x%multiplier%"
        - "%offhand%"
        - "%random%"
        - ""
        - "<gray>(<white>Click to start)"
      
    impossible:
      slot: 16
      material: red_stained_glass_pane
      name: "<red><bold>Impossible"
      glint: true
      lore:
        - "<gray>Lethal interval <dark_gray>» <white>%interval%s"
        - "<gray>Score multiplier <dark_gray>» <green>x%multiplier%"
        - "%offhand%"
        - "%random%"
        - ""
        - "<gray>(<white>Click to start)"